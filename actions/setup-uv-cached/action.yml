name: setup-uv-cached
description: Pinned uv with a cached venv for three-cubes Python repos. The org-standard install seam.
inputs:
  uv-version:
    description: uv version to pin (keep in step with the org standard).
    default: "0.12.5"
  python-version:
    description: Python version uv resolves against.
    default: "3.12"
  sync-args:
    description: >-
      Arguments to `uv sync`. Workspace repos use `--locked --all-packages`;
      single-package repos use e.g. `--all-extras --all-groups`. Per-repo input.
    default: "--locked --all-packages"
  ci-requirements:
    description: >-
      Optional `--require-hashes` requirements file for CI-only tools to install
      into the same .venv (empty string skips this step).
    default: ""
runs:
  using: composite
  steps:
    - name: Install pinned uv (cached)
      uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      with:
        version: ${{ inputs.uv-version }}
        python-version: ${{ inputs.python-version }}
        enable-cache: true
        # Root-anchored, with no `**`. The action's default glob walks the
        # whole workspace, so in a repo that also carries a pnpm workspace it
        # descends every `node_modules` tree — measured at 86.3s to locate 40
        # files, against a 2.0s restore, on every lane of every run.
        #
        # A negated `!**/node_modules/**` does not fix that: @actions/glob
        # decides whether to descend a directory by partial-matching the
        # POSITIVE patterns, so any `**` pattern still traverses the tree and
        # the negation only discards matches afterwards. Naming the two files
        # outright removes the traversal rather than filtering its results.
        # `uv.lock` is the authoritative key — it pins the fully resolved set
        # including every workspace member — and the root `pyproject.toml`
        # carries the config that produces it.
        cache-dependency-glob: |
          uv.lock
          pyproject.toml
    - name: uv sync
      shell: bash
      run: uv sync ${{ inputs.sync-args }}
    - name: Install CI tools (require-hashes)
      if: inputs.ci-requirements != ''
      shell: bash
      run: |
        # `uv sync` above has already resolved the project under its checked-in
        # configuration. This independent, hash-locked tool surface must not
        # re-apply project overrides as unhashed requirements.
        uv pip install --no-config --require-hashes --only-binary :all: -r "${{ inputs.ci-requirements }}"
