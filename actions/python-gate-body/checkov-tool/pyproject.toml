[project]
name = "tc-pipelines-checkov-tool"
version = "0.0.0"
requires-python = ">=3.12,<3.13"
# Version is the generated projection of ../scanner-versions.json.
dependencies = ["checkov==3.2.531"]

[tool.uv]
package = false
# Checkov 3.2.531 requires the vulnerable asteval 1.0.6. Keep the scanner
# isolated from consumer environments and resolve the advisory-fixed release.
override-dependencies = ["asteval>=1.0.9,<1.1"]
