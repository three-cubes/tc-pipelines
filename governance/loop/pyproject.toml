# A uv workspace member: its modules are importable by name through the
# editable install, and its dependencies are declared here (not on a pythonpath).
[project]
name = "orchestration-loops"
version = "0.0.0"
description = "the delivery loops; standard library only"
requires-python = ">=3.13"
dependencies = [
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["/harvest_gate.py", "/loop_dispatcher.py", "/loop_governor.py", "/loop_runner.py", "/loop_state_machine.py", "/tree_reconciler.py"]
