[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tc-agent-tools"
version = "0.2.0"
description = "Trusted host-broker tooling for repository-scoped, short-lived GitHub App authentication."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pyjwt[crypto]>=2,<3"]  # [crypto] -> cryptography, required for RS256 App JWTs

[dependency-groups]
test = ["pytest>=8,<9"]

[project.scripts]
# `agent-token` -> short-lived per-agent App installation token on stdout.
agent-token = "tc_agent_tools.agent_token:main"

[tool.hatch.build.targets.wheel]
packages = ["tc_agent_tools"]

[tool.pytest.ini_options]
testpaths = ["tests"]
