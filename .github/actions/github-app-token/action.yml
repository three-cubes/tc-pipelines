name: 'GitHub App token (via Key Vault + WIF)'
description: |
  Mints a short-lived GitHub App installation token for an agent App, reading the
  App ID + private key from Azure Key Vault over Workload Identity Federation — so
  agents act as their OWN App identity (never a human's) and NO GitHub-stored secret
  is needed. Secret-free by construction, the Three Cubes way.

  Prereqs (one-time per consuming repo):
    - The repo's WIF identity exists with Key Vault Secrets User on the vault —
      provision via infra/bicep/ci-deploy-identity.bicep with keyVaultName=kv-tc-agents.
    - Repo variables AZURE_CLIENT_ID / AZURE_TENANT_ID / AZURE_SUBSCRIPTION_ID.
    - The agent GitHub App is installed on the repo; its App ID + private key are in
      the vault (defaults: github-threecubes-agent-client-id, falling back to
      github-threecubes-agent-app-id, and -private-key).
    - Job permissions: id-token: write (WIF) and contents: read.

  Per-agent Apps (SGO-163): set `agent: builder|shape|consultant|growth` to mint as
  that agent's own App identity (reads github-app-<agent>-{id,key} from the vault).
  Omit `agent` for the canonical three-cubes-agent App. See
  governance/agent-sdlc-access-and-hitl.md.

  Usage (de-templated so the action.yml parser doesn't evaluate the docstring):
    permissions: { id-token: write, contents: read }
    steps:
      - id: app
        uses: three-cubes/tc-pipelines/.github/actions/github-app-token@933274c58b631acf54d94e95d7495daf9180fdac # post-v2.2.0
        with:
          client-id:       {{ vars.AZURE_CLIENT_ID }}
          tenant-id:       {{ vars.AZURE_TENANT_ID }}
          subscription-id: {{ vars.AZURE_SUBSCRIPTION_ID }}
          agent:           builder   # optional; omit for three-cubes-agent
      - run: gh pr create ...
        env: { GH_TOKEN: '{{ steps.app.outputs.token }}' }

inputs:
  client-id:
    description: WIF managed-identity client id (typically vars.AZURE_CLIENT_ID).
    required: true
  tenant-id:
    description: Azure AD tenant id (typically vars.AZURE_TENANT_ID).
    required: true
  subscription-id:
    description: Subscription id (typically vars.AZURE_SUBSCRIPTION_ID).
    required: true
  key-vault-name:
    description: Key Vault holding the agent App credentials.
    required: false
    default: kv-tc-agents
  agent:
    description: >-
      Per-agent App selector (builder|shape|consultant|growth). When set, the
      action reads github-app-<agent>-id / github-app-<agent>-key from the vault,
      overriding app-id-secret / private-key-secret. Empty = the canonical
      three-cubes-agent App (the app-id-secret / private-key-secret defaults).
      See governance/agent-sdlc-access-and-hitl.md.
    required: false
    default: ''
  app-id-secret:
    description: Key Vault secret name for the agent App ID (used when `agent` is empty).
    required: false
    default: github-threecubes-agent-app-id
  client-id-secret:
    description: >-
      Key Vault secret name for the agent App's client ID (used when `agent` is
      empty; per-agent Apps read github-app-<agent>-client-id). The token is
      minted with the client ID when the vault holds one, and with the App ID
      otherwise: actions/create-github-app-token deprecates `app-id`.
    required: false
    default: github-threecubes-agent-client-id
  private-key-secret:
    description: Key Vault secret name for the agent App private key (.pem) (used when `agent` is empty).
    required: false
    default: github-threecubes-agent-private-key
  owner:
    description: Org/owner to scope the token to. Empty = the current repository's owner.
    required: false
    default: ''
  repositories:
    description: Comma/newline list of repos to scope the token to. Empty = the current repository only.
    required: false
    default: ''

  skip-token-revoke:
    description: >-
      `true` keeps the token alive when this job ends, for a caller that hands it to another
      job (the Renovate workflow), which then revokes it itself. Empty or `false`: the token
      is revoked when the job ends.
    required: false
    default: 'false'

  permission-contents:
    description: >-
      Limit the token's contents permission to `read` or `write`. Every `permission-*`
      input that is set narrows the token to exactly the permissions named; with none
      set, the token inherits every permission of the App installation.
    required: false
    default: ''
  permission-pull-requests:
    description: >-
      Limit the token's pull requests permission to `read` or `write`. Every `permission-*`
      input that is set narrows the token to exactly the permissions named; with none
      set, the token inherits every permission of the App installation.
    required: false
    default: ''
  permission-issues:
    description: >-
      Limit the token's issues permission to `read` or `write`. Every `permission-*`
      input that is set narrows the token to exactly the permissions named; with none
      set, the token inherits every permission of the App installation.
    required: false
    default: ''
  permission-workflows:
    description: >-
      Limit the token's workflow files permission to `read` or `write`. Every `permission-*`
      input that is set narrows the token to exactly the permissions named; with none
      set, the token inherits every permission of the App installation.
    required: false
    default: ''
  permission-checks:
    description: >-
      Limit the token's checks permission to `read` or `write`. Every `permission-*`
      input that is set narrows the token to exactly the permissions named; with none
      set, the token inherits every permission of the App installation.
    required: false
    default: ''
  permission-statuses:
    description: >-
      Limit the token's commit statuses permission to `read` or `write`. Every `permission-*`
      input that is set narrows the token to exactly the permissions named; with none
      set, the token inherits every permission of the App installation.
    required: false
    default: ''
  permission-vulnerability-alerts:
    description: >-
      Limit the token's Dependabot alerts permission to `read` or `write`. Every `permission-*`
      input that is set narrows the token to exactly the permissions named; with none
      set, the token inherits every permission of the App installation.
    required: false
    default: ''

outputs:
  token:
    description: The GitHub App installation access token (masked).
    value: ${{ steps.app-token.outputs.token || steps.app-token-by-app-id.outputs.token }}
  app-slug:
    description: >-
      The authenticated remote actor's App slug (e.g. tc-agent-builder). Do not
      use it for Git author or committer metadata; commits always use the
      canonical three-cubes-agent[bot] identity.
    value: ${{ steps.app-token.outputs.app-slug || steps.app-token-by-app-id.outputs.app-slug }}
  installation-id:
    description: The installation id the token was minted for.
    value: ${{ steps.app-token.outputs.installation-id || steps.app-token-by-app-id.outputs.installation-id }}

runs:
  using: composite
  steps:
    - name: Azure login (WIF)
      uses: three-cubes/tc-pipelines/.github/actions/wif-azure-login@b0268816c0dfa911da7b59b03b8b58f7292e7295 # v2.2.1
      with:
        client-id: ${{ inputs.client-id }}
        tenant-id: ${{ inputs.tenant-id }}
        subscription-id: ${{ inputs.subscription-id }}

    - name: Read agent App credentials from Key Vault
      id: kv
      shell: bash
      env:
        KV: ${{ inputs.key-vault-name }}
        AGENT: ${{ inputs.agent }}
        APP_ID_SECRET: ${{ inputs.app-id-secret }}
        CLIENT_ID_SECRET: ${{ inputs.client-id-secret }}
        PK_SECRET: ${{ inputs.private-key-secret }}
      run: |
        set -euo pipefail
        # Resolve which vault secrets hold this identity's App ID + private key.
        # A per-agent selector maps to the github-app-<agent>-{id,key} contract
        # (allowlisted — the value flows into an az arg, so fail fast on anything
        # else); empty falls back to the canonical app-id-secret / private-key-secret.
        case "${AGENT}" in
          "")
            app_id_secret="${APP_ID_SECRET}"
            client_id_secret="${CLIENT_ID_SECRET}"
            pk_secret="${PK_SECRET}" ;;
          builder|shape|consultant|growth)
            app_id_secret="github-app-${AGENT}-id"
            client_id_secret="github-app-${AGENT}-client-id"
            pk_secret="github-app-${AGENT}-key" ;;
          *)
            echo "::error::github-app-token: unknown agent '${AGENT}' (expected builder|shape|consultant|growth, or empty for three-cubes-agent)"
            exit 1 ;;
        esac
        # Mint with the client ID when the vault holds one; the App ID is the
        # fallback for vaults that predate it (create-github-app-token deprecates
        # `app-id`). Exactly one of the two outputs is set.
        client_id="$(az keyvault secret show --vault-name "$KV" --name "$client_id_secret" --query value -o tsv 2>/dev/null || true)"
        if [ -n "${client_id}" ]; then
          echo "::add-mask::${client_id}"
          echo "client-id=${client_id}" >> "$GITHUB_OUTPUT"
        else
          app_id="$(az keyvault secret show --vault-name "$KV" --name "$app_id_secret" --query value -o tsv)"
          echo "::add-mask::${app_id}"
          echo "app-id=${app_id}" >> "$GITHUB_OUTPUT"
        fi
        pem="$(az keyvault secret show --vault-name "$KV" --name "$pk_secret" --query value -o tsv)"
        # Mask every PEM line before it can surface in any later log.
        while IFS= read -r line; do
          [ -n "${line}" ] && echo "::add-mask::${line}"
        done <<< "${pem}"
        {
          echo "private-key<<__TC_PEM_EOF__"
          echo "${pem}"
          echo "__TC_PEM_EOF__"
        } >> "$GITHUB_OUTPUT"

    # One of the two mint steps runs. Naming `app-id` in a step's inputs warns
    # even when it is empty, so the deprecated input appears only in the
    # fallback, for a vault that holds no client ID.
    - name: Mint installation token
      id: app-token
      if: steps.kv.outputs.client-id != ''
      uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
      with:
        client-id: ${{ steps.kv.outputs.client-id }}
        private-key: ${{ steps.kv.outputs.private-key }}
        owner: ${{ inputs.owner }}
        repositories: ${{ inputs.repositories }}
        permission-contents: ${{ inputs.permission-contents }}
        permission-pull-requests: ${{ inputs.permission-pull-requests }}
        permission-issues: ${{ inputs.permission-issues }}
        permission-workflows: ${{ inputs.permission-workflows }}
        permission-checks: ${{ inputs.permission-checks }}
        permission-statuses: ${{ inputs.permission-statuses }}
        permission-vulnerability-alerts: ${{ inputs.permission-vulnerability-alerts }}
        skip-token-revoke: ${{ inputs.skip-token-revoke }}

    - name: Mint installation token (App ID fallback)
      id: app-token-by-app-id
      if: steps.kv.outputs.client-id == ''
      uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
      with:
        app-id: ${{ steps.kv.outputs.app-id }}
        private-key: ${{ steps.kv.outputs.private-key }}
        owner: ${{ inputs.owner }}
        repositories: ${{ inputs.repositories }}
        permission-contents: ${{ inputs.permission-contents }}
        permission-pull-requests: ${{ inputs.permission-pull-requests }}
        permission-issues: ${{ inputs.permission-issues }}
        permission-workflows: ${{ inputs.permission-workflows }}
        permission-checks: ${{ inputs.permission-checks }}
        permission-statuses: ${{ inputs.permission-statuses }}
        permission-vulnerability-alerts: ${{ inputs.permission-vulnerability-alerts }}
        skip-token-revoke: ${{ inputs.skip-token-revoke }}
