name: "self-test · python-quality-gate sharding"

# Exercises the NOVEL wiring the sharding change adds to python-quality-gate.yml:
#   * pytest-shards == 1  → the single byte-identical `quality` job runs; the
#     sharded jobs skip (probe asserts NO shard args / COVERAGE_FILE).
#   * pytest-shards == 2  → `shards` builds the [1,2] matrix, `quality-shard`
#     runs both legs (probe asserts the injected `--split i of N` + COVERAGE_FILE),
#     `coverage-combine` merges the shard data.
# Both call the reusable via the LOCAL `./` ref so this PR's copy (and its
# branch-pinned composite) is what runs. A committed fixture gate stands in for a
# real repo gate; the deep pytest-split + combine mechanics are proven separately.

on:
  pull_request:
    paths:
      - ".github/workflows/python-quality-gate.yml"
      - "actions/python-gate-body/**"
      - ".github/workflows/test-shard-routing.yml"
      - ".github/selftest-fixture/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unsharded:
    name: "shards=1 (byte-identical path)"
    uses: ./.github/workflows/python-quality-gate.yml
    with:
      pytest-shards: 1
      run-no-attribution: false
      write-changed-files: false
      ci-requirements-path: ""
      sync-args: "--locked"
      upload-coverage-artifact: false
      pre-steps: |
        set -euo pipefail
        cp .github/selftest-fixture/.tc-fitness.toml .tc-fitness.toml
        cp .github/selftest-fixture/shard_probe.py shard_probe.py

  sharded:
    name: "shards=2 (matrix + combine path)"
    uses: ./.github/workflows/python-quality-gate.yml
    with:
      pytest-shards: 2
      run-no-attribution: false
      write-changed-files: false
      ci-requirements-path: ""
      sync-args: "--locked"
      upload-coverage-artifact: true
      # Post-combine hook: proves the reusable runs a repo-owned command on the
      # combined coverage XML before the Sonar upload (taz uses this to normalise
      # multi-source paths). Marker is grepped in the coverage-combine job log.
      coverage-combine-post: "echo 'COMBINE-POST-HOOK ran on combined coverage'"
      pre-steps: |
        set -euo pipefail
        cp .github/selftest-fixture/.tc-fitness.toml .tc-fitness.toml
        cp .github/selftest-fixture/shard_probe.py shard_probe.py
        echo "EXPECT_SHARD=1" >> "$GITHUB_ENV"

  # The floor rides in the coverage-combine lane, which unsharded exists for no
  # other reason — so this is the only path where the lane's presence and the
  # floor's execution are the same question.
  floor:
    name: "floor=on (unsharded lane)"
    uses: ./.github/workflows/python-quality-gate.yml
    with:
      pytest-shards: 1
      run-no-attribution: false
      write-changed-files: false
      ci-requirements-path: ""
      sync-args: "--locked"
      upload-coverage-artifact: true
      enforce-new-code-coverage: true
      pre-steps: |
        set -euo pipefail
        cp .github/selftest-fixture/floor.tc-fitness.toml .tc-fitness.toml
        cp .github/selftest-fixture/shard_probe.py shard_probe.py

  floor-lane-ran:
    name: "floor=on: the lane must run, not skip"
    needs: [floor]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Assert the floor lane concluded success
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          # A green `floor` job is not evidence: the lane carrying the floor is
          # allowed to skip, a skipped lane satisfies the fan-in, and the fan-in is
          # what that job reports. Read the lane's own conclusion. The name filter
          # is anchored on this caller job so the sharded self-test's identically
          # named lane cannot stand in for it.
          conclusion="$(gh api "repos/${REPO}/actions/runs/${RUN_ID}/jobs?per_page=100" \
            --jq '.jobs[]
                  | select((.name | startswith("floor=on (unsharded lane)"))
                           and (.name | endswith("Coverage combine + new-code floor")))
                  | .conclusion')"
          echo "floor lane conclusion: ${conclusion:-<no such job>}"
          if [[ "$conclusion" != "success" ]]; then
            echo "::error::the new-code floor lane did not run to success (conclusion='${conclusion:-absent}'). Skipped, it enforces nothing and still lets the gate report green. fix: reconcile coverage-combine's job condition with enforce-new-code-coverage. next: re-run this self-test."
            exit 1
          fi

  tier:
    name: "tier=smoke (selector)"
    uses: ./.github/workflows/python-quality-gate.yml
    with:
      tier: smoke
      run-no-attribution: false
      write-changed-files: false
      ci-requirements-path: ""
      sync-args: "--locked"
      upload-coverage-artifact: false
      pre-steps: |
        set -euo pipefail
        # smoke-step passes; full-step fails if run. --tier smoke must select only
        # the smoke-tagged step, so the gate passes iff tier selection works.
        cp .github/selftest-fixture/tier.tc-fitness.toml .tc-fitness.toml
