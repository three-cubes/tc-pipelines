name: 'Reusable — Azure VM deploy (WIF → snapshot → apply → smoke)'

# Three Cubes shared deploy workflow.
#
# Consumers call this from their own workflow with:
#
#   jobs:
#     deploy:
#       uses: three-cubes/tc-pipelines/.github/workflows/azure-vm-deploy.yml@v1
#       with:
#         resource-group: RG-AGENTS-CORE
#         targets: |
#           - vm-name: vm-openclaw
#             apply-script: |
#               cd /data/development/tc-agent-zone && git pull --ff-only
#               bash devsecops/apply/apply-openclaw-config.sh --no-snapshot
#             smoke-units: 'openclaw-gateway cli-proxy-api caddy'
#           - vm-name: vm-hermes-poc
#             apply-script: |
#               cd /data/development/tc-agent-zone && git pull --ff-only
#               bash devsecops/apply/hermes/apply-config.sh --no-snapshot
#             smoke-units: 'hermes-gateway-northcoast-retention.service'
#         op-tag: deploy-on-merge
#         skip-snapshot: ${{ inputs.skip_snapshot }}
#       permissions:
#         contents: read
#         id-token: write
#         packages: write  # only required when passing ghcr-actions-token
#       secrets:
#         ghcr-actions-token: ${{ secrets.GITHUB_TOKEN }}
#         hermes-runtime-secrets-b64: ${{ secrets.HERMES_RUNTIME_SECRETS_B64 }}
#
# The `targets` input is a YAML string. Parsed at runtime by yq inside the
# job. Each target gets snapshot → apply → smoke in sequence.

on:
  workflow_call:
    secrets:
      ghcr-actions-token:
        description: |
          Optional job-lifetime GitHub Actions token relayed to the remote
          apply only as the protected HERMES_GHCR_ACTIONS_TOKEN parameter.
        required: false
      hermes-runtime-secrets-b64:
        description: |
          Optional repository Actions secret relayed to the remote apply only
          as the protected HERMES_RUNTIME_SECRETS_B64 parameter. When supplied,
          it must be canonical Base64 of at most 49,152 encoded bytes and
          36,864 decoded bytes.
        required: false
    inputs:
      resource-group:
        description: Azure resource group containing all target VMs.
        required: true
        type: string
      targets:
        description: |
          YAML string. List of {vm-name, apply-script, smoke-units} maps.
          See header comment for the canonical shape.
        required: true
        type: string
      op-tag:
        description: Short tag for the snapshot name (e.g. apply-config, deploy-on-merge).
        required: true
        type: string
      skip-snapshot:
        description: |
          Set to "true" to skip snapshot-before-apply. Dev override only.
        required: false
        type: string
        default: 'false'
      snapshot-policy:
        description: |
          Snapshot policy for this deployment. "allowed" preserves the
          existing snapshot behavior. "forbidden" selects the governed
          container-only deployment exception and requires skip-snapshot=true
          plus container-rollback-receipt-digest.
        required: false
        type: string
        default: allowed
      container-rollback-receipt-digest:
        description: |
          Content-addressed digest of the verified immutable rollback receipt
          created before apply. Required as sha256:<64 lowercase hex> when
          snapshot-policy is "forbidden". The receipt must bind the protected
          configuration/path backup and predecessor OCI image.
        required: false
        type: string
        default: ''
      azure-client-id:
        description: WIF identity client ID (typically vars.AZURE_CLIENT_ID).
        required: true
        type: string
      azure-tenant-id:
        description: Azure AD tenant ID (typically vars.AZURE_TENANT_ID).
        required: true
        type: string
      azure-subscription-id:
        description: Subscription ID (typically vars.AZURE_SUBSCRIPTION_ID).
        required: true
        type: string
      surface-apply-output:
        description: |
          Set to "true" to expose the concatenated apply-script output (all
          targets) as the job output `apply-output`, so a caller can read a
          value the apply script printed (e.g. a benchmark/eval marker) in a
          downstream job. Off by default — apply output is not surfaced unless
          a consumer opts in. Protected Managed Run Command invocations expose
          only the generated exit proof because their arbitrary output is
          suppressed to prevent truncated secret disclosure.
        required: false
        type: string
        default: 'false'
      preflight-script:
        description: |
          Optional remote script executed on every target before any snapshot
          or apply. A non-empty script must print exactly one
          PREFLIGHT_RECEIPT_DIGEST=sha256:<64 lowercase hex> marker across the
          target set. A failure blocks snapshot and apply.
        required: false
        type: string
        default: ''
      failure-cleanup-script:
        description: |
          Optional remote cleanup script executed on every target when
          preflight begins and preflight, snapshot, or apply later fails or is
          cancelled. Use it to thaw resources frozen by a complete or partial
          preflight; it is never run when preflight is skipped.
        required: false
        type: string
        default: ''
    outputs:
      preflight-status:
        description: 'Preflight result: skipped, passed, or failed.'
        value: ${{ jobs.deploy.outputs.preflight-status }}
      preflight-receipt-digest:
        description: Content-addressed receipt printed by the remote preflight.
        value: ${{ jobs.deploy.outputs.preflight-receipt-digest }}
      snapshot-resource-id:
        description: Newline-separated Azure resource IDs for created snapshots.
        value: ${{ jobs.deploy.outputs.snapshot-resource-id }}
      apply-output:
        description: |
          Concatenated apply-script output when surface-apply-output is true;
          empty otherwise. Protected invocations contribute only their
          generated exit proof, never arbitrary remote output.
        value: ${{ jobs.deploy.outputs.apply-output }}

jobs:
  deploy:
    name: WIF → snapshot → apply → smoke
    runs-on: ubuntu-latest
    outputs:
      preflight-status: ${{ steps.preflight.outputs.status }}
      preflight-receipt-digest: ${{ steps.preflight.outputs.receipt-digest }}
      snapshot-resource-id: ${{ steps.snapshot.outputs.snapshot-resource-ids }}
      # Concatenated apply-script output across all targets. Empty unless the
      # caller sets `surface-apply-output: 'true'`. Lets a downstream caller job
      # read a value the apply script printed (e.g. a benchmark marker).
      apply-output: ${{ steps.apply.outputs.apply-output }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Validate deployment policy and protected input
        shell: bash
        env:
          HERMES_RUNTIME_SECRETS_B64: ${{ secrets.hermes-runtime-secrets-b64 }}
          SKIP_SNAPSHOT: ${{ inputs.skip-snapshot }}
          SNAPSHOT_POLICY: ${{ inputs.snapshot-policy }}
          CONTAINER_ROLLBACK_RECEIPT_DIGEST: ${{ inputs.container-rollback-receipt-digest }}
        run: |
          set -euo pipefail
          SKIP_SNAPSHOT="${SKIP_SNAPSHOT:-false}"
          case "$SNAPSHOT_POLICY" in
            allowed|forbidden) ;;
            *)
              echo "::error::snapshot-policy must be allowed or forbidden" >&2
              exit 1
              ;;
          esac
          case "$SKIP_SNAPSHOT" in
            true|false) ;;
            *)
              echo "::error::skip-snapshot must be true or false" >&2
              exit 1
              ;;
          esac
          if [[ "$SNAPSHOT_POLICY" == "forbidden" && "$SKIP_SNAPSHOT" != "true" ]]; then
            echo "::error::snapshot-policy=forbidden requires skip-snapshot=true" >&2
            exit 1
          fi
          if [[ "$SNAPSHOT_POLICY" == "forbidden" && ! "$CONTAINER_ROLLBACK_RECEIPT_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::snapshot-policy=forbidden requires a verified container rollback receipt digest (sha256:<64 lowercase hex>)" >&2
            exit 1
          fi
          python3 - <<'PY'
          import base64
          import binascii
          import os
          import sys

          value = os.environ.get("HERMES_RUNTIME_SECRETS_B64", "")
          if not value:
              raise SystemExit(0)

          def reject() -> None:
              print(
                  "::error::Hermes runtime secret must be canonical Base64 of at "
                  "most 49152 encoded bytes and 36864 decoded bytes",
                  file=sys.stderr,
              )
              raise SystemExit(1)

          try:
              encoded = value.encode("ascii")
          except UnicodeEncodeError:
              reject()
          if len(encoded) > 49152:
              reject()
          try:
              decoded = base64.b64decode(encoded, validate=True)
          except (binascii.Error, ValueError):
              reject()
          if (
              not decoded
              or len(decoded) > 36864
              or base64.b64encode(decoded) != encoded
          ):
              reject()
          PY

      - name: WIF Azure login
        uses: three-cubes/tc-pipelines/.github/actions/wif-azure-login@v1
        with:
          client-id: ${{ inputs.azure-client-id }}
          tenant-id: ${{ inputs.azure-tenant-id }}
          subscription-id: ${{ inputs.azure-subscription-id }}

      - name: Parse targets
        id: parse
        shell: bash
        env:
          TARGETS_YAML: ${{ inputs.targets }}
        run: |
          set -euo pipefail
          # Extract just the VM names for the snapshot step (comma-separated).
          VM_LIST=$(echo "$TARGETS_YAML" | yq '[.[].vm-name] | join(",")' -)
          echo "vm-list=${VM_LIST}" >>"$GITHUB_OUTPUT"

      - name: Remote preflight
        id: preflight
        shell: bash
        env:
          PREFLIGHT_SCRIPT: ${{ inputs.preflight-script }}
          TARGETS_YAML: ${{ inputs.targets }}
          RG: ${{ inputs.resource-group }}
        run: |
          set -euo pipefail
          {
            echo "status=failed"
            echo "receipt-digest="
            echo "cleanup-required=false"
          } >>"$GITHUB_OUTPUT"
          if [[ -z "$PREFLIGHT_SCRIPT" ]]; then
            echo "status=skipped" >>"$GITHUB_OUTPUT"
            exit 0
          fi

          PREFLIGHT_ACC="$(mktemp)"
          trap 'rm -f "$PREFLIGHT_ACC"' EXIT
          run_with_retry() {
            local description="$1"; shift
            local attempt=1
            local max_attempts=5
            local wait_seconds=10
            while [[ $attempt -le $max_attempts ]]; do
              if OUT=$("$@" 2>&1); then
                printf '%s\n' "$OUT"
                return 0
              fi
              if grep -q "(Conflict)" <<<"$OUT"; then
                if (( attempt >= max_attempts )); then
                  break
                fi
                echo "::warning::${description}: attempt ${attempt}/${max_attempts} hit (Conflict); retrying in ${wait_seconds}s" >&2
                sleep "$wait_seconds"
                wait_seconds=$((wait_seconds * 2))
                attempt=$((attempt + 1))
                continue
              fi
              printf '%s\n' "$OUT"
              return 1
            done
            echo "::error::${description}: exhausted ${max_attempts} retries on (Conflict)" >&2
            return 1
          }
          COUNT=$(echo "$TARGETS_YAML" | yq 'length' -)
          # From this point at least one remote preflight may freeze resources.
          # Persist the cleanup obligation before the first Run Command so a
          # later target failure or cancellation cannot strand earlier targets.
          echo "cleanup-required=true" >>"$GITHUB_OUTPUT"
          for i in $(seq 0 $((COUNT - 1))); do
            VM=$(echo "$TARGETS_YAML" | yq ".[${i}].vm-name" -)
            REMOTE_SUCCESS_TOKEN="TC_PREFLIGHT_REMOTE_SUCCESS_${GITHUB_RUN_ID}_${i}_${RANDOM}"
            set +e
            MSG=$(run_with_retry "preflight on ${VM}" az vm run-command invoke \
              --resource-group "$RG" \
              --name "$VM" \
              --command-id RunShellScript \
              --scripts "set -e; export HOME=/root; ${PREFLIGHT_SCRIPT}; printf '%s\n' '${REMOTE_SUCCESS_TOKEN}'" \
              --query 'value[0].message' -o tsv 2>&1)
            RC=$?
            set -e
            echo "----- BEGIN ${VM} preflight output -----"
            echo "$MSG"
            echo "----- END ${VM} preflight output -----"
            printf '%s\n' "$MSG" >>"$PREFLIGHT_ACC"
            mapfile -t RECEIPTS < <(
              grep -oE 'PREFLIGHT_RECEIPT_DIGEST=sha256:[0-9a-f]{64}' <<<"$MSG" |
                sed 's/^PREFLIGHT_RECEIPT_DIGEST=//'
            )
            if [[ "${#RECEIPTS[@]}" -gt 1 ]]; then
              echo "::error::preflight on ${VM} produced multiple receipt digests"
              exit 1
            fi
            if [[ "$RC" -ne 0 ]]; then
              echo "::error::remote preflight failed on ${VM} (rc=${RC}); no snapshot or apply ran"
              exit "$RC"
            fi
            if [[ $(grep -Fxc "$REMOTE_SUCCESS_TOKEN" <<<"$MSG") -ne 1 ]]; then
              echo "::error::remote preflight did not prove success on ${VM}; no snapshot or apply ran"
              exit 1
            fi
            MSG_FILE="$(mktemp)"
            printf '%s\n' "$MSG" >"$MSG_FILE"
            python3 - "$VM" "$MSG_FILE" <<'PY'
          import re
          import sys
          from pathlib import Path

          vm = sys.argv[1]
          message = Path(sys.argv[2]).read_text(encoding="utf-8")
          patterns = (
              re.compile(r"(^|\n)FAIL(?:\s|:)", re.IGNORECASE),
              re.compile(r"(^|\n)ERROR:", re.IGNORECASE),
              re.compile(r"\bPermission denied\b", re.IGNORECASE),
              re.compile(r"(^|\n)fatal:\s+", re.IGNORECASE),
              re.compile(r"Traceback \(most recent call last\):"),
              re.compile(r"\bIllegal option -o pipefail\b"),
          )
          matches = [pattern.pattern for pattern in patterns if pattern.search(message)]
          if matches:
              print(f"::error::Preflight on {vm} reported fatal output markers:", file=sys.stderr)
              for match in matches:
                  print(f"  - {match}", file=sys.stderr)
              raise SystemExit(1)
          PY
            rm -f "$MSG_FILE"
          done

          mapfile -t RECEIPTS < <(
            grep -oE 'PREFLIGHT_RECEIPT_DIGEST=sha256:[0-9a-f]{64}' "$PREFLIGHT_ACC" |
              sed 's/^PREFLIGHT_RECEIPT_DIGEST=//' |
              sort -u
          )
          if [[ "${#RECEIPTS[@]}" -eq 0 ]]; then
            echo "::error::preflight produced no valid receipt digest"
            exit 1
          fi
          if [[ "${#RECEIPTS[@]}" -ne 1 ]]; then
            echo "::error::preflight produced multiple receipt digests"
            printf '  - %s\n' "${RECEIPTS[@]}"
            exit 1
          fi
          echo "receipt-digest=${RECEIPTS[0]}" >>"$GITHUB_OUTPUT"
          echo "status=passed" >>"$GITHUB_OUTPUT"

      - name: Snapshot all VMs
        id: snapshot
        if: ${{ inputs.snapshot-policy != 'forbidden' }}
        uses: three-cubes/tc-pipelines/.github/actions/snapshot-azure-vm-disk@v1
        with:
          resource-group: ${{ inputs.resource-group }}
          vm-names: ${{ steps.parse.outputs.vm-list }}
          op-tag: ${{ inputs.op-tag }}
          skip: ${{ inputs.skip-snapshot }}

      - name: Verify host snapshots are forbidden
        if: ${{ inputs.snapshot-policy == 'forbidden' }}
        shell: bash
        run: echo "Host disk capture is forbidden by deployment policy."

      - name: Apply on each target + smoke
        id: apply
        shell: bash
        env:
          GHCR_ACTIONS_TOKEN: ${{ secrets.ghcr-actions-token }}
          HERMES_RUNTIME_SECRETS_B64: ${{ secrets.hermes-runtime-secrets-b64 }}
          TARGETS_YAML: ${{ inputs.targets }}
          RG: ${{ inputs.resource-group }}
          SURFACE_OUTPUT: ${{ inputs.surface-apply-output }}
        run: |
          set -euo pipefail
          managed_apply_create() {
            local vm="$1"
            local command_name="$2"
            local script="$3"
            local ghcr_token_fd=""
            local runtime_secret_fd=""
            local -a protected_parameters=()
            local rc=0
            # Azure CLI treats each protected parameter as one nargs item.
            # Give every value its own inherited FD and argv item; rebuild the
            # streams on every retry because az consumes them while parsing.
            if [[ -n "$GHCR_ACTIONS_TOKEN" ]]; then
              exec {ghcr_token_fd}< <(
                printf 'HERMES_GHCR_ACTIONS_TOKEN=%s' "$GHCR_ACTIONS_TOKEN"
              )
              protected_parameters+=("@/dev/fd/${ghcr_token_fd}")
            fi
            if [[ -n "$HERMES_RUNTIME_SECRETS_B64" ]]; then
              exec {runtime_secret_fd}< <(
                printf 'HERMES_RUNTIME_SECRETS_B64=%s' "$HERMES_RUNTIME_SECRETS_B64"
              )
              protected_parameters+=("@/dev/fd/${runtime_secret_fd}")
            fi
            az vm run-command create \
              --resource-group "$RG" \
              --vm-name "$vm" \
              --run-command-name "$command_name" \
              --script "$script" \
              --protected-parameters "${protected_parameters[@]}" \
              --timeout-in-seconds 5400 \
              --query 'provisioningState' -o tsv || rc=$?
            if [[ -n "$ghcr_token_fd" ]]; then
              exec {ghcr_token_fd}<&-
            fi
            if [[ -n "$runtime_secret_fd" ]]; then
              exec {runtime_secret_fd}<&-
            fi
            return "$rc"
          }

          # The protected parameter above is the sole token transport. Keep the
          # Actions-provided secret as a non-exported shell value so unrelated
          # child processes in this step do not inherit it.
          PROTECTED_GHCR_ACTIONS_TOKEN="${GHCR_ACTIONS_TOKEN:-}"
          unset GHCR_ACTIONS_TOKEN
          declare GHCR_ACTIONS_TOKEN="$PROTECTED_GHCR_ACTIONS_TOKEN"
          unset PROTECTED_GHCR_ACTIONS_TOKEN
          readonly GHCR_ACTIONS_TOKEN
          PROTECTED_HERMES_RUNTIME_SECRETS_B64="${HERMES_RUNTIME_SECRETS_B64:-}"
          unset HERMES_RUNTIME_SECRETS_B64
          declare HERMES_RUNTIME_SECRETS_B64="$PROTECTED_HERMES_RUNTIME_SECRETS_B64"
          unset PROTECTED_HERMES_RUNTIME_SECRETS_B64
          readonly HERMES_RUNTIME_SECRETS_B64

          INVOCATION_SUFFIX=""
          MANAGED_COMMAND_MANIFEST=""
          if [[ -n "$GHCR_ACTIONS_TOKEN$HERMES_RUNTIME_SECRETS_B64" ]]; then
            INVOCATION_SUFFIX=$(python3 -c 'import secrets; print(secrets.token_hex(6))')
            MANAGED_COMMAND_MANIFEST="${RUNNER_TEMP}/managed-apply-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${INVOCATION_SUFFIX}.jsonl"
            : >"$MANAGED_COMMAND_MANIFEST"
          fi
          echo "managed-command-manifest=${MANAGED_COMMAND_MANIFEST}" >>"$GITHUB_OUTPUT"

          PENDING_MANAGED_VM=""
          PENDING_MANAGED_COMMAND=""
          cleanup_managed_command() {
            if [[ -z "$PENDING_MANAGED_VM" || -z "$PENDING_MANAGED_COMMAND" ]]; then
              return 0
            fi
            local vm="$PENDING_MANAGED_VM"
            local command_name="$PENDING_MANAGED_COMMAND"
            local delete_output
            if ! delete_output=$(run_with_retry "delete managed apply command on ${vm}" \
              az vm run-command delete \
              --resource-group "$RG" \
              --vm-name "$vm" \
              --run-command-name "$command_name" \
              --yes); then
              printf '%s\n' "$delete_output" >&2
              echo "::error::failed to delete managed apply command ${command_name} on ${vm}"
              return 1
            fi
            PENDING_MANAGED_VM=""
            PENDING_MANAGED_COMMAND=""
          }
          trap cleanup_managed_command EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM

          # Accumulate each target's apply output so it can optionally be
          # surfaced as the `apply-output` job output (see surface-apply-output).
          APPLY_ACC="$(mktemp)"
          # az vm run-command is serialised per-VM by Azure — invocations
          # collide with a (Conflict) error when a prior extension run is
          # still in flight (operator ad-hoc commands, prior deploy that
          # didn't finish cleaning up, etc.). Retry with backoff so the
          # workflow doesn't fail on transient collisions.
          redact_stream() {
            local line
            while IFS= read -r line || [[ -n "$line" ]]; do
              if [[ -n "$GHCR_ACTIONS_TOKEN" ]]; then
                line="${line//"$GHCR_ACTIONS_TOKEN"/***}"
              fi
              if [[ -n "$HERMES_RUNTIME_SECRETS_B64" ]]; then
                line="${line//"$HERMES_RUNTIME_SECRETS_B64"/***}"
              fi
              printf '%s\n' "$line"
            done
          }
          run_with_retry() {
            local description="$1"; shift
            local attempt=1
            local max_attempts=5
            local wait_seconds=10
            while [[ $attempt -le $max_attempts ]]; do
              local attempt_dir stdout_pipe stderr_pipe stdout_file stderr_file stdout_pid stderr_pid rc
              attempt_dir=$(mktemp -d)
              stdout_pipe="${attempt_dir}/stdout.pipe"
              stderr_pipe="${attempt_dir}/stderr.pipe"
              stdout_file="${attempt_dir}/stdout"
              stderr_file="${attempt_dir}/stderr"
              mkfifo "$stdout_pipe" "$stderr_pipe"
              redact_stream <"$stdout_pipe" >"$stdout_file" &
              stdout_pid=$!
              redact_stream <"$stderr_pipe" >"$stderr_file" &
              stderr_pid=$!
              set +e
              "$@" >"$stdout_pipe" 2>"$stderr_pipe"
              rc=$?
              set -e
              wait "$stdout_pid"
              wait "$stderr_pid"
              if [[ "$rc" -eq 0 ]]; then
                if [[ -s "$stderr_file" ]]; then
                  cat "$stderr_file" >&2
                fi
                cat "$stdout_file"
                rm -rf "$attempt_dir"
                return 0
              fi
              if grep -q "(Conflict)" "$stderr_file"; then
                echo "::warning::${description}: attempt ${attempt}/${max_attempts} hit (Conflict); retrying in ${wait_seconds}s" >&2
                cat "$stderr_file" >&2
                rm -rf "$attempt_dir"
                sleep "$wait_seconds"
                wait_seconds=$((wait_seconds * 2))
                attempt=$((attempt + 1))
                continue
              fi
              # Non-Conflict error — surface immediately, don't retry blindly.
              cat "$stdout_file" >&2
              cat "$stderr_file" >&2
              rm -rf "$attempt_dir"
              return 1
            done
            echo "::error::${description}: exhausted ${max_attempts} retries on (Conflict)" >&2
            return 1
          }
          gate_run_command_output() {
            local vm="$1"
            local remote_exit_sentinel="$2"
            local message_file="$3"
            python3 - "$vm" "$remote_exit_sentinel" "$message_file" <<'PY'
          import re
          import sys
          from pathlib import Path

          vm = sys.argv[1]
          sentinel = sys.argv[2]
          message = Path(sys.argv[3]).read_text(encoding="utf-8")
          sentinel_lines = [
              line for line in message.splitlines() if line.startswith(f"{sentinel}=")
          ]
          valid = (
              re.fullmatch(
                  rf"{re.escape(sentinel)}=([0-9]{{1,3}})", sentinel_lines[0]
              )
              if len(sentinel_lines) == 1
              else None
          )
          if valid is None:
              print(
                  f"::error::remote apply did not prove an exact exit status on {vm}",
                  file=sys.stderr,
              )
              raise SystemExit(1)
          remote_exit = int(valid.group(1))
          if remote_exit > 255 or remote_exit != 0:
              print(
                  f"::error::remote apply did not prove an exact exit status on {vm}",
                  file=sys.stderr,
              )
              raise SystemExit(1)
          patterns = (
              re.compile(r"(^|\n)FAIL(?:\s|:)", re.IGNORECASE),
              re.compile(r"(^|\n)✗\s+"),
              re.compile(r"(^|\n)ERROR:", re.IGNORECASE),
              re.compile(r"\bPermission denied\b", re.IGNORECASE),
              re.compile(r"(^|\n)fatal:\s+", re.IGNORECASE),
              re.compile(r"\bcommand not found\b", re.IGNORECASE),
              re.compile(r"Traceback \(most recent call last\):"),
              re.compile(r"\bIllegal option -o pipefail\b"),
          )
          matches = [match.group(0).strip() for pattern in patterns if (match := pattern.search(message))]
          if matches:
              print(f"::error::Apply on {vm} reported fatal run-command output markers:", file=sys.stderr)
              for match in matches:
                  print(f"  - {match}", file=sys.stderr)
              raise SystemExit(1)
          PY
          }
          # Iterate targets, calling the per-VM script + smoke check inline.
          # We do this inline (not as a matrix) because az run-command is
          # serial-friendly + matrix would each pay the checkout cost.
          COUNT=$(echo "$TARGETS_YAML" | yq 'length' -)
          for i in $(seq 0 $((COUNT - 1))); do
            VM=$(echo "$TARGETS_YAML" | yq ".[${i}].vm-name" -)
            SCRIPT=$(echo "$TARGETS_YAML" | yq ".[${i}].apply-script" -)
            UNITS=$(echo "$TARGETS_YAML" | yq ".[${i}].smoke-units" -)
            echo "=== Deploying ${VM} ==="
            RUN_COMMAND_NAME="apply-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${INVOCATION_SUFFIX}-${i}"
            MANAGED_FAILURE=""
            REMOTE_EXIT_SENTINEL="TC_APPLY_REMOTE_EXIT_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}_${i}_${RANDOM}"
            REMOTE_GROUP_END=')'
            if [[ -n "$GHCR_ACTIONS_TOKEN$HERMES_RUNTIME_SECRETS_B64" ]]; then
              # Azure retains only the last 4 KiB of instanceView output. A
              # truncated secret cannot be redacted reliably, so protected
              # runs discard caller output at the VM and emit only exit proof.
              REMOTE_GROUP_END=') >/dev/null 2>&1'
            fi
            REMOTE_SCRIPT=$(
              printf '%s\n' \
                'set +e' \
                '(' \
                '  set -e' \
                '  export HOME=/root' \
                '  exec 9>/run/lock/tc-pipelines-azure-vm-deploy.lock' \
                '  flock 9' \
                "$SCRIPT" \
                "$REMOTE_GROUP_END" \
                "remote_rc=\$?" \
                "printf '%s=%s\\n' '${REMOTE_EXIT_SENTINEL}' \"\$remote_rc\"" \
                "exit \"\$remote_rc\""
            )
            if [[ -n "$GHCR_ACTIONS_TOKEN$HERMES_RUNTIME_SECRETS_B64" ]]; then
              jq -cn --arg vm "$VM" --arg command "$RUN_COMMAND_NAME" \
                '{vm: $vm, command: $command}' >>"$MANAGED_COMMAND_MANIFEST"
              PENDING_MANAGED_VM="$VM"
              PENDING_MANAGED_COMMAND="$RUN_COMMAND_NAME"
            fi
            if [[ -z "$GHCR_ACTIONS_TOKEN$HERMES_RUNTIME_SECRETS_B64" ]]; then
              MSG=$(run_with_retry "apply on ${VM}" az vm run-command invoke \
                --resource-group "$RG" \
                --name "$VM" \
                --command-id RunShellScript \
                --scripts "$REMOTE_SCRIPT" \
                --query 'value[0].message' -o tsv)
            else
              MSG=$(run_with_retry "managed apply on ${VM}" \
                managed_apply_create "$VM" "$RUN_COMMAND_NAME" "$REMOTE_SCRIPT")
              MANAGED_RESULT=$(run_with_retry "managed apply result on ${VM}" \
                az vm run-command show \
                --resource-group "$RG" \
                --vm-name "$VM" \
                --run-command-name "$RUN_COMMAND_NAME" \
                --instance-view -o json)
              MANAGED_STATE=$(jq -r '.instanceView.executionState // ""' <<<"$MANAGED_RESULT")
              MANAGED_EXIT_CODE=$(jq -r '.instanceView.exitCode // ""' <<<"$MANAGED_RESULT")
              mapfile -t MANAGED_SENTINELS < <(
                jq -r --arg sentinel "$REMOTE_EXIT_SENTINEL" '
                  [.instanceView.output // "", .instanceView.error // ""][]
                  | split("\n")[]
                  | select(startswith($sentinel + "="))
                ' <<<"$MANAGED_RESULT"
              )
              if [[ "${#MANAGED_SENTINELS[@]}" -eq 1 && "${MANAGED_SENTINELS[0]}" == "${REMOTE_EXIT_SENTINEL}=${MANAGED_EXIT_CODE}" ]]; then
                MSG="${REMOTE_EXIT_SENTINEL}=${MANAGED_EXIT_CODE}"
              else
                MSG=""
              fi
              if ! cleanup_managed_command; then
                MANAGED_FAILURE="managed command cleanup failed on ${VM}"
              fi
              if [[ "$MANAGED_STATE" != "Succeeded" || "$MANAGED_EXIT_CODE" != "0" ]]; then
                if [[ -n "$MANAGED_FAILURE" ]]; then
                  MANAGED_FAILURE+="; "
                fi
                MANAGED_FAILURE+="managed apply failed on ${VM} (state=${MANAGED_STATE:-missing}, exit=${MANAGED_EXIT_CODE:-missing})"
              fi
            fi
            echo "----- BEGIN ${VM} apply output -----"
            echo "$MSG"
            echo "----- END ${VM} apply output -----"
            printf '=== %s ===\n%s\n' "$VM" "$MSG" >> "$APPLY_ACC"
            MSG_FILE=$(mktemp)
            printf '%s\n' "$MSG" >"$MSG_FILE"
            if ! gate_run_command_output "$VM" "$REMOTE_EXIT_SENTINEL" "$MSG_FILE"; then
              rm -f "$MSG_FILE"
              exit 1
            fi
            rm -f "$MSG_FILE"
            if [[ -n "$MANAGED_FAILURE" ]]; then
              echo "::error::${MANAGED_FAILURE}"
              exit 1
            fi
            if [[ -n "${UNITS}" && "${UNITS}" != "null" ]]; then
              echo "=== Smoke ${VM} (${UNITS}) ==="
              SMOKE_MSG=$(run_with_retry "smoke on ${VM}" az vm run-command invoke \
                --resource-group "$RG" \
                --name "$VM" \
                --command-id RunShellScript \
                --scripts "systemctl is-active ${UNITS} 2>&1 | tr '\n' ' '; echo" \
                --query 'value[0].message' -o tsv)
              echo "${VM}: ${SMOKE_MSG}"
              # az run-command returns a `message` field that includes its own
              # "Enable succeeded:" preamble + stdout/stderr block markers
              # alongside the actual script output. Don't require EVERY line
              # to match — instead, ensure each requested unit appears at
              # least once as "active" in the message.
              #
              # Counting note: split the message into one-word-per-line and
              # count exact matches. Using grep -oE with a delimiter-aware
              # pattern undercounts because consecutive matches share the
              # space character (e.g. "active active active" → 2 matches).
              EXPECTED_UNIT_COUNT=$(echo "${UNITS}" | wc -w)
              ACTIVE_COUNT=$(echo "$SMOKE_MSG" | tr -s '[:space:]' '\n' | grep -cx 'active')
              # Also fail if we see any failure-state markers anywhere in the
              # message (more specific than "missing active").
              if echo "$SMOKE_MSG" | grep -qE '\b(inactive|failed|activating|deactivating|unknown)\b'; then
                echo "::error::Unit on ${VM} reports non-active state. Output: ${SMOKE_MSG}"
                exit 1
              fi
              if [[ "$ACTIVE_COUNT" -lt "$EXPECTED_UNIT_COUNT" ]]; then
                echo "::error::Expected ${EXPECTED_UNIT_COUNT} active units on ${VM}, found ${ACTIVE_COUNT}. Output: ${SMOKE_MSG}"
                exit 1
              fi
            fi
          done
          # Opt-in: expose the concatenated apply output as the `apply-output`
          # job output so a caller can read a value the apply script printed.
          # Off by default (no output, current behaviour). Multiline value via a
          # randomised heredoc delimiter that cannot collide with apply text.
          if [[ "${SURFACE_OUTPUT:-false}" == "true" ]]; then
            DELIM="KX_APPLY_OUTPUT_$RANDOM$RANDOM"
            {
              echo "apply-output<<${DELIM}"
              cat "$APPLY_ACC"
              echo "${DELIM}"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Ensure managed apply commands are deleted
        if: ${{ always() && steps.apply.outputs.managed-command-manifest != '' }}
        shell: bash
        env:
          MANAGED_COMMAND_MANIFEST: ${{ steps.apply.outputs.managed-command-manifest }}
          RG: ${{ inputs.resource-group }}
        run: |
          set -euo pipefail
          if [[ ! -f "$MANAGED_COMMAND_MANIFEST" ]]; then
            echo "::error::managed command manifest is missing"
            exit 1
          fi
          run_with_retry() {
            local description="$1"; shift
            local attempt=1
            local max_attempts=5
            local wait_seconds=10
            while [[ $attempt -le $max_attempts ]]; do
              if OUT=$("$@" 2>&1); then
                printf '%s\n' "$OUT"
                return 0
              fi
              if grep -q "(Conflict)" <<<"$OUT"; then
                if (( attempt >= max_attempts )); then
                  break
                fi
                echo "::warning::${description}: attempt ${attempt}/${max_attempts} hit (Conflict); retrying in ${wait_seconds}s" >&2
                sleep "$wait_seconds"
                wait_seconds=$((wait_seconds * 2))
                attempt=$((attempt + 1))
                continue
              fi
              printf '%s\n' "$OUT"
              return 1
            done
            echo "::error::${description}: exhausted ${max_attempts} retries on (Conflict)" >&2
            return 1
          }
          CLEANUP_FAILED=0
          while IFS= read -r entry; do
            VM=$(jq -r '.vm' <<<"$entry")
            COMMAND_NAME=$(jq -r '.command' <<<"$entry")
            set +e
            MSG=$(run_with_retry "delete managed apply command on ${VM}" \
              az vm run-command delete \
              --resource-group "$RG" \
              --vm-name "$VM" \
              --run-command-name "$COMMAND_NAME" \
              --yes 2>&1)
            RC=$?
            set -e
            if [[ "$RC" -ne 0 ]] && ! grep -qiE 'ResourceNotFound|NotFound|could not be found' <<<"$MSG"; then
              printf '%s\n' "$MSG" >&2
              echo "::error::failed to ensure managed command ${COMMAND_NAME} is deleted on ${VM}"
              CLEANUP_FAILED=1
            fi
          done <"$MANAGED_COMMAND_MANIFEST"
          if [[ "$CLEANUP_FAILED" -eq 0 ]]; then
            rm -f "$MANAGED_COMMAND_MANIFEST"
          fi
          exit "$CLEANUP_FAILED"

      - name: Failure cleanup
        if: ${{ always() && (failure() || cancelled()) && steps.preflight.outputs.cleanup-required == 'true' && inputs.failure-cleanup-script != '' }}
        shell: bash
        env:
          CLEANUP_SCRIPT: ${{ inputs.failure-cleanup-script }}
          TARGETS_YAML: ${{ inputs.targets }}
          RG: ${{ inputs.resource-group }}
        run: |
          set -euo pipefail
          run_with_retry() {
            local description="$1"; shift
            local attempt=1
            local max_attempts=5
            local wait_seconds=10
            while [[ $attempt -le $max_attempts ]]; do
              if OUT=$("$@" 2>&1); then
                printf '%s\n' "$OUT"
                return 0
              fi
              if grep -q "(Conflict)" <<<"$OUT"; then
                if (( attempt >= max_attempts )); then
                  break
                fi
                echo "::warning::${description}: attempt ${attempt}/${max_attempts} hit (Conflict); retrying in ${wait_seconds}s" >&2
                sleep "$wait_seconds"
                wait_seconds=$((wait_seconds * 2))
                attempt=$((attempt + 1))
                continue
              fi
              printf '%s\n' "$OUT"
              return 1
            done
            echo "::error::${description}: exhausted ${max_attempts} retries on (Conflict)" >&2
            return 1
          }
          CLEANUP_FAILED=0
          COUNT=$(echo "$TARGETS_YAML" | yq 'length' -)
          for i in $(seq 0 $((COUNT - 1))); do
            VM=$(echo "$TARGETS_YAML" | yq ".[${i}].vm-name" -)
            REMOTE_SUCCESS_TOKEN="TC_CLEANUP_REMOTE_SUCCESS_${GITHUB_RUN_ID}_${i}_${RANDOM}"
            echo "=== Failure cleanup ${VM} ==="
            set +e
            MSG=$(run_with_retry "failure cleanup on ${VM}" az vm run-command invoke \
              --resource-group "$RG" \
              --name "$VM" \
              --command-id RunShellScript \
              --scripts "set -e; export HOME=/root; ${CLEANUP_SCRIPT}; printf '%s\n' '${REMOTE_SUCCESS_TOKEN}'" \
              --query 'value[0].message' -o tsv 2>&1)
            RC=$?
            set -e
            printf '%s\n' "$MSG"
            if [[ "$RC" -ne 0 ]] || [[ $(grep -Fxc "$REMOTE_SUCCESS_TOKEN" <<<"$MSG") -ne 1 ]]; then
              echo "::error::failure cleanup did not prove success on ${VM}"
              CLEANUP_FAILED=1
            fi
          done
          exit "$CLEANUP_FAILED"
