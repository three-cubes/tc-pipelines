name: example — loop-implement (reusable self-check)

# Static call-graph self-check for the `loop-implement.yml` reusable. The job `uses:` it
# via its LOCAL path with a real consumer's input shape, so actionlint and
# GitHub's reusable-workflow resolver validate input names, required-input
# presence, types and secret shapes against the reusable's `workflow_call:`
# contract at parse time — a mismatch fails HERE rather than in a consumer's
# pipeline.
#
# NEVER runs the underlying work by default: `workflow_call` only, and the job is
# gated on `run-for-real`, whose default is false. Flipping it true would dispatch an autonomous implementation run against a real branch.

on:
  workflow_call:
    inputs:
      run-for-real:
        description: >-
          Leave false (default) for the static call-graph self-check — the job
          stays gated off and only the input/secret SHAPES are validated. The
          dispatcher (example-callers.yml) passes this through.
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # A work-item-shaped call: the issue identity and the branch the loop commits
  # to, plus the repository it operates on.
  implement-shape:
    if: ${{ inputs.run-for-real }}
    uses: ./.github/workflows/loop-implement.yml
    with:
      issue-id: "EXA-000"
      issue-branch: "example/exa-000-shape-check"
      repo: "three-cubes/example"
