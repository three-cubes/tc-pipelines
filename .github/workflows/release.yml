name: release

# Reusable (workflow_call) release SPINE for three-cubes repos.
#
# The THIN COMMON spine only — the steps every three-cubes release shares:
#   1. validate the CalVer tag (regex + tag-doesn't-already-exist)
#   2. extract the matching CHANGELOG section into release notes
#   3. create + push the annotated git tag
#   4. `gh release create` (draft by default for human review)
#   5. optional fan-out hook (dispatch downstream publish workflows)
#
# Repo-specific RELEASE GATES STAY IN THE CALLER — they are NOT generalized
# here. kairix keeps its alpha VM-regression gate, F49 baseline-shrink, and
# paydown-doc-currency checks in its own `release.yml` as a `needs:` job that
# runs BEFORE it calls this reusable. taz keeps its VERSION-file trigger +
# `release-check.sh` on its side. This spine assumes those gates have already
# passed: a caller reaches this workflow only after its own pre-release job is
# green.
#
# TOUCHES THE RELEASE PATH (HITL / G4): running a caller that invokes this
# workflow cuts a real tag + GitHub Release and (when enabled) fans out to
# publish. It must only be dispatched with explicit per-action authorization.
#
# All input values are bound through `env:` before use in `run:` scripts to
# avoid workflow-injection via the input string.
#
# Part of three-cubes/kairix#499 Phase 4 (org CI consolidation).

on:
  workflow_call:
    inputs:
      # ── Required release coordinates ────────────────────────────────────
      version:
        description: "Tag to create (e.g. v2026.5.10.6). Validated against calver-pattern."
        type: string
        required: true
      changelog-label:
        description: >-
          Deprecated compatibility input. When set, must equal `version` with
          a conventional leading `v` removed; it cannot select another section.
        type: string
        default: ""
      # ── Per-repo shape ──────────────────────────────────────────────────
      calver-pattern:
        description: >-
          Extended-regex (grep -E) the version must match. Default is kairix's
          CalVer vYYYY.M.D[.N]; taz can pass its own (no leading 'v', etc.).
        type: string
        default: '^v[0-9]{4}\.[0-9]{1,2}\.[0-9]{1,2}(\.[0-9]+)?$'
      changelog-extract-command:
        description: >-
          Optional deprecated compatibility extractor. Its output must exactly
          equal the canonical version-derived CHANGELOG section.
        type: string
        default: ""
      changelog-file:
        description: Repository-relative CHANGELOG path prepared for the release.
        type: string
        default: CHANGELOG.md
      version-file:
        description: >-
          Repository-relative version source written by prepare-release-metadata.
          Empty skips the version-file binding for repos without one.
        type: string
        default: VERSION
      release-preparation-file:
        description: >-
          Repository-relative receipt created by prepare-release-metadata before
          the release PR is merged.
        type: string
        default: .release-prepared.json
      release-title:
        description: >-
          Title for the GitHub Release. The literal string $VERSION is expanded
          to the tag at runtime (single-quoted in callers so it reaches here raw).
        type: string
        default: "kairix $VERSION"
      tag-message:
        description: >-
          Annotation message for `git tag -a`. $VERSION expands to the tag.
        type: string
        default: "kairix $VERSION"
      # ── Behaviour toggles ───────────────────────────────────────────────
      draft:
        description: "Create the GitHub Release as a draft for human review (recommended)."
        type: boolean
        default: true
      ref:
        description: "Git ref to check out, tag, and create the release from."
        type: string
        default: "main"
      fetch-depth:
        description: "checkout fetch-depth. 0 = full history (tag-existence + notes)."
        type: number
        default: 0
      fan-out-command:
        description: >-
          Optional shell run AFTER the release is created, to dispatch downstream
          publish workflows. $VERSION and $REF are exported. Empty string skips the fan-out
          (taz has no fan-out; kairix dispatches docker-publish + publish-pypi).
          The release job uses the three-cubes-agent App token, so a published
          release also emits its downstream release event.
        type: string
        default: |
          gh workflow run docker-publish.yml --ref "$REF" --field ref="$VERSION"
          gh workflow run publish-pypi.yml   --ref "$REF" --field ref="$VERSION"
# tag + release creation needs write; the fan-out dispatches workflows.
permissions:
  contents: write
  actions: write
  id-token: write

jobs:
  release:
    name: Tag + GitHub Release (from CHANGELOG)
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: ${{ inputs.fetch-depth }}

      - name: Mint three-cubes-agent token for release
        id: app
        uses: three-cubes/tc-pipelines/.github/actions/github-app-token@8eac47d7519032e61b1d4fe00f3e4ac1ef67579e # v1.19.12
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Validate version format
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          CALVER_PATTERN: ${{ inputs.calver-pattern }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$VERSION" | grep -Eq "$CALVER_PATTERN"; then
            echo "::error::version '$VERSION' does not match calver-pattern '$CALVER_PATTERN'"
            echo "fix: pass a tag matching the pattern, or override calver-pattern for this repo."
            exit 1
          fi
          if git rev-parse "$VERSION" >/dev/null 2>&1; then
            echo "::error::tag '$VERSION' already exists"
            echo "fix: bump the version input; a tag is immutable once pushed."
            exit 1
          fi

      - name: Validate prepared release metadata
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          CHANGELOG_FILE: ${{ inputs.changelog-file }}
          VERSION_FILE: ${{ inputs.version-file }}
          PREPARATION_FILE: ${{ inputs.release-preparation-file }}
        run: |
          set -euo pipefail
          PREPARATION_FILE="${PREPARATION_FILE:-.release-prepared.json}"
          CHANGELOG_FILE="${CHANGELOG_FILE:-CHANGELOG.md}"
          VERSION_FILE="${VERSION_FILE:-VERSION}"
          if [ ! -f "$PREPARATION_FILE" ]; then
            echo "::error::release preparation receipt is absent: $PREPARATION_FILE" >&2
            echo "fix: run three-cubes/tc-pipelines/actions/prepare-release-metadata in the release PR and commit its outputs before cutting $VERSION." >&2
            exit 1
          fi
          python3 - "$VERSION" "$CHANGELOG_FILE" "$VERSION_FILE" "$PREPARATION_FILE" <<'PY'
          import hashlib
          import json
          import sys
          from pathlib import Path

          version, changelog_name, version_name, receipt_name = sys.argv[1:]
          label = version.removeprefix("v")
          changelog = Path(changelog_name)
          version_file = Path(version_name) if version_name else None
          receipt = Path(receipt_name)

          def digest(path: Path) -> str:
              return hashlib.sha256(path.read_bytes()).hexdigest()

          try:
              record = json.loads(receipt.read_text(encoding="utf-8"))
          except (OSError, json.JSONDecodeError) as error:
              raise SystemExit(f"::error::release preparation receipt is unreadable: {error}")
          expected = {
              "schema": "three-cubes/release-preparation/v1",
              "version": version,
              "changelog": changelog_name,
              "changelog_sha256": digest(changelog),
              "version_file": version_name if version_file else "",
              "version_file_sha256": digest(version_file) if version_file else "",
          }
          if record != expected:
              raise SystemExit(
                  "::error::release preparation receipt does not bind this "
                  "version, changelog, and version source exactly"
              )
          if version_file and version_file.read_text(encoding="utf-8").strip() != label:
              raise SystemExit("::error::release version source does not match tag")
          print("release preparation receipt matches the candidate release")
          PY

      - name: Extract release notes from CHANGELOG
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          LEGACY_CHANGELOG_LABEL: ${{ inputs.changelog-label }}
          EXTRACT_COMMAND: ${{ inputs.changelog-extract-command }}
          CHANGELOG_FILE: ${{ inputs.changelog-file }}
        run: |
          set -euo pipefail
          # A release has one coordinate. The changelog heading is its tag with
          # only the conventional leading `v` removed, so callers cannot tag one
          # version while publishing notes from another section.
          CHANGELOG_LABEL="${VERSION#v}"
          CHANGELOG_FILE="${CHANGELOG_FILE:-CHANGELOG.md}"
          if [ -n "${LEGACY_CHANGELOG_LABEL:-}" ] && [ "$LEGACY_CHANGELOG_LABEL" != "$CHANGELOG_LABEL" ]; then
            echo "::error::changelog-label must equal the version-derived [$CHANGELOG_LABEL] section" >&2
            echo "fix: remove the deprecated changelog-label input, or set it to $CHANGELOG_LABEL." >&2
            exit 1
          fi
          awk -v label="$CHANGELOG_LABEL" '
            index($0, "## [" label "]") == 1 { in_section = 1; next }
            in_section && index($0, "## ") == 1 { exit }
            in_section { print }
          ' "$CHANGELOG_FILE" > /tmp/canonical-release-notes.md
          if [ -n "${EXTRACT_COMMAND:-}" ]; then
            # Existing callers may retain their extractor while migrating. It
            # is a verifier only: a different body is rejected rather than
            # letting an independently selected section reach the Release.
            eval "$EXTRACT_COMMAND" > /tmp/caller-release-notes.md
            if ! cmp -s /tmp/canonical-release-notes.md /tmp/caller-release-notes.md; then
              echo "::error::deprecated changelog-extract-command disagrees with the version-derived CHANGELOG section" >&2
              echo "fix: remove the deprecated command, or make it emit exactly [$CHANGELOG_LABEL]." >&2
              exit 1
            fi
          fi
          cp /tmp/canonical-release-notes.md /tmp/release-notes.md
          # Non-whitespace, not size: a heading with no body under it extracts
          # to a single newline, which `[ -s ]` counts as content. The Release
          # then publishes blank while this job reports success.
          if ! grep -q '[^[:space:]]' /tmp/release-notes.md; then
            echo "::error::no release notes extracted for [$CHANGELOG_LABEL]"
            echo "fix: add a populated '## [$CHANGELOG_LABEL]' section to CHANGELOG.md before cutting $VERSION."
            exit 1
          fi
          echo "::group::Release notes preview"
          cat /tmp/release-notes.md
          echo "::endgroup::"

      - name: Tag ref
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          TAG_MESSAGE: ${{ inputs.tag-message }}
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          set -euo pipefail
          git config user.name "three-cubes-agent[bot]"
          git config user.email "295831460+three-cubes-agent[bot]@users.noreply.github.com"
          # Expand $VERSION inside the message template the caller supplied.
          message=$(VERSION="$VERSION" envsubst <<< "$TAG_MESSAGE")
          git tag -a "$VERSION" -m "$message"
          git push origin "$VERSION"

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          VERSION: ${{ inputs.version }}
          RELEASE_TITLE: ${{ inputs.release-title }}
          DRAFT: ${{ inputs.draft }}
        run: |
          set -euo pipefail
          # Draft (default) lands the Release for operator review of the rendered
          # CHANGELOG notes before Publish. The git tag (and any artefacts built
          # from its SHA) ship deterministically regardless of draft state, so the
          # gate is on the operator-facing notes only.
          title=$(VERSION="$VERSION" envsubst <<< "$RELEASE_TITLE")
          draft_flag=()
          if [ "$DRAFT" = "true" ]; then
            draft_flag=(--draft)
          fi
          gh release create "$VERSION" \
              --title "$title" \
              --notes-file /tmp/release-notes.md \
              --verify-tag \
              "${draft_flag[@]}"

      - name: Fan out to downstream publish workflows
        if: inputs.fan-out-command != ''
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          VERSION: ${{ inputs.version }}
          REF: ${{ inputs.ref }}
          FAN_OUT_COMMAND: ${{ inputs.fan-out-command }}
        run: |
          set -euo pipefail
          # Caller-supplied dispatch command(s). VERSION + REF are exported for it.
          eval "$FAN_OUT_COMMAND"

      - name: Summary
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          DRAFT: ${{ inputs.draft }}
        run: |
          {
            echo "## Release $VERSION"
            echo ""
            echo "- Tag pushed: \`$VERSION\`"
            if [ "$DRAFT" = "true" ]; then
              echo "- GitHub Release created as a **draft** (notes from CHANGELOG) — review then Publish."
            else
              echo "- GitHub Release published (notes from CHANGELOG)."
            fi
            echo "- Downstream publishes: dispatched via fan-out-command (when set)."
          } >> "$GITHUB_STEP_SUMMARY"
