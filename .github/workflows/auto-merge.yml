---
name: "auto-merge request"

# Lights-out merge (SGO-166): this metadata-only workflow records
# `gh pr merge --auto` as the three-cubes-agent App when a PR opens or changes.
# GitHub performs the merge after branch protection accepts every required
# check and review. CODEOWNERS holds control-plane changes for a maintainer.
# The pull_request_target trigger loads this workflow from main. It never
# checks out, executes, or imports pull-request content.
#
# Prerequisites (org-admin, one-time):
#   - repo/org vars AZURE_CLIENT_ID / AZURE_TENANT_ID / AZURE_SUBSCRIPTION_ID
#     for the WIF identity that mints the three-cubes-agent App token from
#     kv-tc-agents.
#   - the "main" ruleset set to required_approving_review_count: 0 +
#     require_code_owner_review: true (so work auto-merges while owned paths
#     hold).

on:
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions: {}

jobs:
  merge:
    permissions:
      contents: read
      id-token: write        # WIF federation to mint the App token
      pull-requests: write   # enable auto-merge on the PR
    uses: ./.github/workflows/auto-merge-on-green.yml
    with:
      merge-method: merge            # merge commit; all methods enabled, standardise on merge
      enqueue: false
      pr-number: ${{ github.event.pull_request.number }}
      arm-immediately: true
      azure-client-id: ${{ vars.AZURE_CLIENT_ID }}
      azure-tenant-id: ${{ vars.AZURE_TENANT_ID }}
      azure-subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
