name: example — release prepared merge (reusable self-check)

# Static call-graph check for release-on-merge.yml. The false-by-default input
# makes GitHub resolve the complete nested reusable contract without creating a
# tag or Release.
on:
  workflow_call:
    inputs:
      run-for-real:
        description: Keep false for contract validation.
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  release-prepared-merge:
    if: ${{ inputs.run-for-real }}
    permissions:
      actions: write
      contents: write
      id-token: write
    uses: ./.github/workflows/release-on-merge.yml
    with:
      merge-sha: "0000000000000000000000000000000000000000"
      calver-pattern: '^v[0-9]+\.[0-9]+\.[0-9]+$'
      version-file: ""
      release-title: three-cubes-fitness $VERSION
      tag-message: three-cubes-fitness $VERSION
      draft: false
      fan-out-command: ""
