name: pytest-durations-refresh

# Regenerates the `.test_durations` map that `pytest-shards > 1` splits on, by
# running the suite on a CI runner and storing what each test actually cost there.
#
# The map must be produced on the same class of machine that runs the shards.
# Durations captured on a developer workstation do not scale uniformly to a
# runner: compute-bound tests stay proportional while subprocess-heavy ones
# (git, docker, node shell-outs) cost far more, so a locally-captured map
# under-weights exactly the tests that come to dominate a shard. The split then
# balances against fiction and one shard sets the critical path for the rest.
#
# `--store-durations` is injected through PYTEST_ADDOPTS so the suite still runs
# through the repo's own gate step — the command, markers and coverage flags stay
# whatever `[tool.tc_fitness]` declares, and this workflow does not restate them.
# `--store-durations` and `--splits/--group` are mutually exclusive in
# pytest-split, so `tc-fitness-args` must select the step WITHOUT `--shard`.
#
# Output is an artifact, never a push: the caller decides whether to open a PR,
# so a refresh can never rewrite a balance-critical input unreviewed.

on:
  workflow_call:
    inputs:
      python-version:
        description: "Python version for the run."
        type: string
        required: true
      uv-version:
        description: "uv version, pinned to match the consumer's gate."
        type: string
        required: true
      sync-args:
        description: "Arguments for `uv sync` (e.g. `--locked --all-packages`)."
        type: string
        required: true
      ci-requirements-path:
        description: "Path to the CI requirements file."
        type: string
        required: true
      tc-fitness-args:
        description: >-
          Arguments to the engine CLI, including the subcommand — e.g.
          `run --only platform-pytest`. Matches `python-quality-gate.yml`, whose
          default is `run`; the composite invokes `uv run tc-fitness <these args>`
          verbatim, so omitting `run` fails before pytest starts. Select the
          pytest step alone, and NOT with `--shard`: pytest-split cannot store
          durations and split in the same run.
        type: string
        required: true
      durations-path:
        description: "Path the map is written to, matching the repo's `shard_args`."
        type: string
        required: false
        default: ".test_durations"
      artifact-name:
        description: "Name of the uploaded artifact carrying the refreshed map."
        type: string
        required: false
        default: "test-durations"
      timeout-minutes:
        description: >-
          Job timeout. A durations run is unsharded, so it takes roughly the sum
          of what the shards take in parallel — set this well above gate timeouts.
        type: number
        required: false
        default: 180
      fetch-depth:
        description: >-
          Checkout depth. Deliberately deeper than the gate's default of 2: a
          suite with tests that read git history times those tests differently
          against a shallow clone, and the map has to describe the slow case.
        type: number
        required: false
        default: 0
      run-node:
        description: "Provision node/pnpm when tests shell out to them."
        type: boolean
        required: false
        default: false
      node-version-file:
        description: "Node version file when `run-node` is set."
        type: string
        required: false
        default: ".nvmrc"
      pnpm-version:
        description: >-
          pnpm version when `run-node` is set. Carries
          `python-quality-gate.yml`'s pin: left empty, `pnpm/action-setup`
          resolves from `packageManager`/`devEngines` or fails outright, so an
          omitting caller could install a different pnpm here than its gate uses
          — or not install one at all — and time a differently built tree.
        type: string
        required: false
        default: "10.27.0"
      pnpm-install-args:
        description: >-
          Arguments for `pnpm install` when `run-node` is set. Matches
          `python-quality-gate.yml`'s default so a consumer that states the value
          in neither place still builds the same node tree in both. A refresh
          that ran lifecycle scripts the gate skips would time a suite the shards
          never execute, which is the divergence this map exists to remove.
        type: string
        required: false
        default: "--frozen-lockfile --ignore-scripts"
      ts-coverage-command:
        description: >-
          TS coverage command. Deliberately empty rather than the gate's
          `pnpm -r --if-present test:coverage`: TS coverage adds nothing to a
          pytest durations map and only lengthens the run. Node is still
          provisioned when `run-node` is set, which is what the suite needs.
        type: string
        required: false
        default: ""
      pre-evaluation-normalize:
        description: >-
          Deterministic safe source-normalisation command, forwarded to the
          shared gate body before the timed suite. Must match the consumer's
          python-quality-gate input so the durations map times the same source
          state as the quality gate. Empty string skips the phase.
        type: string
        required: false
        default: ""
      pre-steps:
        description: >-
          Shell run BEFORE the suite, matching what the consumer's gate call
          passes. A consumer that generates fixtures or starts a local service in
          `pre-steps` would otherwise time a differently prepared suite here, and
          the map would describe a run its gate never performs.
        type: string
        required: false
        default: ""
      post-steps:
        description: "Shell run after the suite, matching the consumer's gate call."
        type: string
        required: false
        default: ""
    secrets:
      gh-token:
        description: "Token forwarded to the gate body."
        required: false
    outputs:
      artifact-name:
        description: "Artifact holding the refreshed durations map."
        value: ${{ inputs.artifact-name }}

permissions:
  contents: read

jobs:
  refresh:
    name: Refresh pytest durations
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
    env:
      # Prepended to pytest's arguments, so it adds the storage flags without
      # displacing anything the gate step already passes.
      PYTEST_ADDOPTS: "--store-durations --durations-path ${{ inputs.durations-path }}"
    steps:
      - name: Reject a sharded selection
        if: ${{ contains(inputs.tc-fitness-args, '--shard') }}
        run: |
          echo "::error::tc-fitness-args contains --shard, but pytest-split cannot store durations and split in one run — the map would describe a single shard's slice and rebalance the suite onto it. fix: pass the unsharded selection (e.g. 'run --only platform-pytest'). next: re-run."
          exit 1

      - name: Run the suite and store durations
        uses: three-cubes/tc-pipelines/actions/python-gate-body@1c2944c0cca248bd42fa2e56e84fc3d97a9c698b # v1.19.11 # SHA pin (SGO-266)
        with:
          python-version: ${{ inputs.python-version }}
          uv-version: ${{ inputs.uv-version }}
          sync-args: ${{ inputs.sync-args }}
          ci-requirements-path: ${{ inputs.ci-requirements-path }}
          fetch-depth: ${{ inputs.fetch-depth }}
          tc-fitness-args: ${{ inputs.tc-fitness-args }}
          write-changed-files: false
          changed-files-path: ""
          run-no-attribution: false
          pre-evaluation-normalize: ${{ inputs.pre-evaluation-normalize }}
          # The composite checks out before it runs pre-steps, so clearing the
          # map has to happen HERE — a step ahead of the composite would be undone
          # by that checkout. A consumer commits its map, so the file is on disk
          # before the suite runs; left in place, a refresh that writes nothing
          # (a selection naming a non-pytest step, a pytest command matching no
          # tests) leaves the checked-in file to satisfy the assertion below and
          # ship as a fresh map. The consumer's own pre-steps follow, so the
          # suite is prepared exactly as its gate prepares it.
          pre-steps: |
            rm -f -- "${{ inputs.durations-path }}"
            ${{ inputs.pre-steps }}
          post-steps: ${{ inputs.post-steps }}
          run-node: ${{ inputs.run-node }}
          node-version-file: ${{ inputs.node-version-file }}
          pnpm-version: ${{ inputs.pnpm-version }}
          pnpm-install-args: ${{ inputs.pnpm-install-args }}
          ts-coverage-command: ${{ inputs.ts-coverage-command }}
          # Matches python-quality-gate.yml: an omitted optional secret falls
          # back to the workflow token, so a suite that shells out to gh/git or
          # the API still authenticates instead of failing on an empty value.
          gh-token: ${{ secrets.gh-token || github.token }}
          # Coverage is a gate concern, not a durations concern; the paths are
          # still required inputs, so they carry the composite's own defaults.
          coverage-xml-path: "coverage.xml"
          coverage-artifact-name: "coverage-data"
          upload-coverage-artifact: false

      - name: Assert the map was written and is usable
        env:
          DURATIONS_PATH: ${{ inputs.durations-path }}
        run: |
          set -euo pipefail
          path="$DURATIONS_PATH"
          if [[ ! -s "$path" ]]; then
            echo "::error::$path is missing or empty after the run — PYTEST_ADDOPTS did not reach pytest, or the selected step ran no tests. fix: confirm tc-fitness-args selects the pytest step. next: re-run and check the step log for '--store-durations'."
            exit 1
          fi
          python3 - "$path" <<'PY'
          import json, sys
          path = sys.argv[1]
          with open(path) as handle:
              durations = json.load(handle)
          if not isinstance(durations, dict) or not durations:
              raise SystemExit(f"::error::{path} is not a non-empty object — pytest-split cannot split on it.")
          total = sum(durations.values())
          print(f"entries={len(durations)} total={total:.0f}s")
          # A map recording near-zero time carries no ordering for the splitter to
          # use, which is the silent form of this failure: the split proceeds and
          # balances arbitrarily.
          if total <= 0:
              raise SystemExit(f"::error::{path} totals {total}s — the split would be arbitrary.")
          PY

      - name: Upload the refreshed map
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{ inputs.durations-path }}
          # `.test_durations` is a dotfile and upload-artifact v4 excludes hidden
          # files by default, so without this the upload finds nothing and the
          # error below fires on a run that actually succeeded.
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
