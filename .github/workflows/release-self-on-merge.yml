name: release tc-pipelines merge

on:
  pull_request:
    types: [closed]
    paths:
      - .release-prepared.json
  workflow_dispatch:
    inputs:
      merge-sha:
        description: Exact reviewed merge commit SHA to release.
        required: true
        type: string

permissions: {}

jobs:
  release:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true &&
      github.event.pull_request.merge_commit_sha != '')
    permissions:
      actions: write
      contents: write
      id-token: write
    uses: ./.github/workflows/release-on-merge.yml
    with:
      merge-sha: ${{ inputs.merge-sha || github.event.pull_request.merge_commit_sha }}
      calver-pattern: '^v[0-9]+\.[0-9]+\.[0-9]+$'
      release-title: 'tc-pipelines $VERSION'
      tag-message: 'tc-pipelines $VERSION'
      draft: false
      fan-out-command: ""
