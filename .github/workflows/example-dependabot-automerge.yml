name: example — dependabot-automerge (reusable self-check)

# Static call-graph self-check for the `dependabot-automerge.yml` reusable. The job `uses:` it
# via its LOCAL path with a real consumer's input shape, so actionlint and
# GitHub's reusable-workflow resolver validate input names, required-input
# presence, types and secret shapes against the reusable's `workflow_call:`
# contract at parse time — a mismatch fails HERE rather than in a consumer's
# pipeline.
#
# NEVER runs the underlying work by default: `workflow_call` only, and the job is
# gated on `run-for-real`, whose default is false. Flipping it true would attempt to merge a real pull request.

on:
  workflow_call:
    inputs:
      run-for-real:
        description: >-
          Leave false (default) for the static call-graph self-check — the job
          stays gated off and only the input/secret SHAPES are validated. The
          dispatcher (example-callers.yml) passes this through.
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # Only the WIF identity triple is required: the reusable resolves the PR
  # from the triggering event.
  automerge-shape:
    if: ${{ inputs.run-for-real }}
    uses: ./.github/workflows/dependabot-automerge.yml
    with:
      azure-client-id: "00000000-0000-0000-0000-000000000000"
      azure-tenant-id: "00000000-0000-0000-0000-000000000000"
      azure-subscription-id: "00000000-0000-0000-0000-000000000000"
