[project]
name = "assurance-generated-consumer"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = ["coverage>=7", "pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/consumer"]

[[tool.tc_fitness.steps]]
id = "consumer-tests"
run = ["coverage", "run", "--branch", "--source=consumer", "-m", "pytest", "-q", "tests", "--junitxml=artifacts/junit.xml"]

[[tool.tc_fitness.steps]]
id = "consumer-coverage"
run = ["coverage", "xml", "-o", "artifacts/coverage.xml"]
