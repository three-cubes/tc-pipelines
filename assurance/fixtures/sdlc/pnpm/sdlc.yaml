schema: tc.sdlc/v1
project: tc-sdlc-pnpm-consumer
toolchains:
  python: "3.13"
  node: "24"
  packageManager: pnpm@11.22.0
  uv: "0.12.5"
fitness:
  package: three-cubes-fitness
  version: "0.17.0"
projects:
  - name: node-service
    root: .
targets:
  prepare:
    command: node scripts/prepare.mjs
    mode: prepare
    trustBoundary: portable
    inputs:
      - package.json
      - pnpm-lock.yaml
      - sdlc.yaml
      - scripts/prepare.mjs
      - src/input.txt
    outputs:
      - generated/value.txt
  check:
    command: node tests/check-pnpm-cache.mjs
    mode: evaluate
    trustBoundary: portable
    dependsOn: [prepare]
    inputs:
      - package.json
      - pnpm-lock.yaml
      - sdlc.yaml
      - scripts/prepare.mjs
      - src/**
      - generated/**
      - tests/**
